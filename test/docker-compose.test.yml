# E2E stack (PLAN.md §12, R36). Run via test/run_e2e.sh, or:
#   docker compose -f test/docker-compose.test.yml up --build \
#     --abort-on-container-exit --exit-code-from playwright
#   docker compose -f test/docker-compose.test.yml down -v
#
# Nothing is published to the host, so a running `finally` container on :8000
# is left alone.
name: finally-e2e

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: finally-e2e-app
  environment:
    LLM_MOCK: "true"
    OPENROUTER_API_KEY: ""
    MASSIVE_API_KEY: ""
  # Fresh, throwaway database on every run: no named volume.
  tmpfs:
    - /app/db

services:
  # Shared by every test that changes state. Not named "app": Chromium
  # HSTS-preloads the .app TLD and would force https://app:8000.
  finally: *app

  # Never written to: the fresh-start scenario reads it (see playwright.config.ts).
  finally-fresh: *app

  playwright:
    # Keep the tag in step with @playwright/test in test/package.json.
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /e2e
    ipc: host
    init: true
    environment:
      CI: "true"
      HOST_UID: ${HOST_UID:-0}
      HOST_GID: ${HOST_GID:-0}
      BASE_URL: http://finally:8000
      FRESH_BASE_URL: http://finally-fresh:8000
    volumes:
      - ./:/e2e
      # Container-local node_modules, so a host install never leaks in.
      - /e2e/node_modules
    entrypoint: ["sh", "/e2e/entrypoint.sh"]
    depends_on:
      finally:
        condition: service_healthy
      finally-fresh:
        condition: service_healthy
